<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de horas médicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Centro Médico Vida Salud</h1>
        <p>Sistema de reserva de horas médicas</p>
    </header>

    <main>
        <section>
            <h2>Reservar una hora médica</h2>

            <form>
                <label>Nombre del paciente</label>
                <input type="text" placeholder="Nombre ficticio" required>

                <label>Especialidad médica</label>
                <select required>
                    <option>Medicina general</option>
                    <option>Odontología</option>
                    <option>Pediatría</option>
                    <option>Cardiología</option>
                </select>

                <label>Fecha de atención</label>
                <input type="date" required>

                <label>Horario</label>
                <input type="time" required>

                <button type="button" onclick="alert('Simulación de reserva')">
                    Reservar hora
                </button>
            </form>

            <p>Formulario demostrativo. No almacena datos.</p>
        </section>

        <section>
            <h2>Información del servicio</h2>
            <p>Atención de lunes a viernes.</p>
            <p>Horario: 08:00 a 18:00 horas.</p>
            <p class="estado">Estado: Servicio disponible</p>
        </section>
    </main>

    <footer>
        <p>Proyecto integrador DevOps - 2026</p>
    </footer>

</body>
</html>
